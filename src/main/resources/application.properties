server.port=${PORT:8080}

# MySQL Database (auto-creates lending_db locally)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lending_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MySQL@2025}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# JWT Configuration (must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:DigitalLendingSuperSecretKeyForJwtSigning2026!!}
app.jwt.expiration-ms=86400000

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html