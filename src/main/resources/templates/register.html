<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - SprintLend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="card shadow-sm mx-auto p-4" style="max-width: 520px;">
        <h3 class="mb-3 text-center">Borrower Registration</h3>
        <div id="alertBox" class="alert alert-danger d-none"></div>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="fullName" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password (min 6 chars)</label>
                    <input type="password" id="password" class="form-control" required minlength="6">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">PAN Number</label>
                    <input type="text" id="pan" class="form-control text-uppercase" required placeholder="ABCDE1234F">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Monthly Income (₹)</label>
                    <input type="number" id="monthlyIncome" class="form-control" required min="1000">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Employment Type</label>
                <select id="employmentType" class="form-select">
                    <option value="SALARIED">Salaried</option>
                    <option value="SELF_EMPLOYED">Self Employed</option>
                    <option value="BUSINESS">Business</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Account & Continue</button>
        </form>
        <p class="text-center mt-3 mb-0 small">
            Already registered? <a th:href="@{/login}">Login here</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alertBox');
        alertBox.classList.add('d-none');

        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                pan: document.getElementById('pan').value.toUpperCase(),
                monthlyIncome: Number(document.getElementById('monthlyIncome').value),
                employmentType: document.getElementById('employmentType').value
            })
        });
        const data = await res.json();
        if (!res.ok) {
            const details = data.fieldErrors ? Object.values(data.fieldErrors).join(', ') : data.message;
            alertBox.innerText = details || 'Registration failed';
            alertBox.classList.remove('d-none');
            return;
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('fullName', data.fullName);
        window.location.href = '/borrower/dashboard';
    });
</script>
</body>
</html>
