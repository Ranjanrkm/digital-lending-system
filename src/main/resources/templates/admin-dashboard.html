<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - SprintLend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div id="msgBox" class="alert d-none"></div>

    <div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h5 class="mb-0">All Loan Applications</h5>
            <select id="statusFilter" class="form-select w-auto" onchange="loadAdminLoans()">
                <option value="">All Statuses</option>
                <option value="APPLIED">APPLIED</option>
                <option value="APPROVED">APPROVED</option>
                <option value="REJECTED">REJECTED</option>
                <option value="CLOSED">CLOSED</option>
            </select>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>Borrower</th><th>Income</th><th>Amount</th><th>Tenure</th><th>EMI</th><th>Status</th><th>Decision</th>
                </tr>
                </thead>
                <tbody id="adminLoansBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token || localStorage.getItem('role') !== 'ADMIN') window.location.href = '/login';

    function showMsg(text, isError = false) {
        const box = document.getElementById('msgBox');
        box.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
        box.innerText = text;
    }

    async function loadAdminLoans() {
        const status = document.getElementById('statusFilter').value;
        const url = status ? `/api/admin/loans?status=${status}` : '/api/admin/loans';
        const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
        const loans = await res.json();

        document.getElementById('adminLoansBody').innerHTML = loans.length === 0
            ? '<tr><td colspan="8" class="text-center text-muted">No matching loans found.</td></tr>'
            : loans.map(l => `
            <tr>
                <td>#${l.id}</td>
                <td><strong>${l.borrowerName}</strong><br><small class="text-muted">${l.borrowerEmail}</small></td>
                <td>₹${l.borrowerMonthlyIncome}</td>
                <td>₹${l.amount}</td>
                <td>${l.tenureMonths} mos</td>
                <td>₹${l.emi}</td>
                <td><span class="badge bg-info text-dark">${l.status}</span></td>
                <td>${l.status === 'APPLIED' ? `
                    <input type="text" id="remark-${l.id}" class="form-control form-control-sm mb-1" placeholder="Remark...">
                    <button class="btn btn-sm btn-success me-1" onclick="decide(${l.id}, 'approve')">Approve</button>
                    <button class="btn btn-sm btn-danger" onclick="decide(${l.id}, 'reject')">Reject</button>
                ` : `<small class="text-muted">${l.adminRemark || '-'}</small>`}</td>
            </tr>`).join('');
    }

    async function decide(loanId, action) {
        const remark = document.getElementById(`remark-${loanId}`).value;
        const res = await fetch(`/api/admin/loans/${loanId}/${action}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ remark })
        });
        const data = await res.json();
        if (!res.ok) return showMsg(data.message, true);
        showMsg(`Loan #${loanId} marked as ${data.status}!`);
        loadAdminLoans();
    }

    loadAdminLoans();
</script>
</body>
</html>
