<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Borrower Dashboard - SprintLend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div id="msgBox" class="alert d-none"></div>

    <!-- Apply for Loan Form -->
    <div class="card shadow-sm p-4 mb-4">
        <h5 class="mb-3">Apply for a New Loan (12% Annual Interest)</h5>
        <form id="applyForm" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Loan Amount (₹10,000 – ₹50,00,000)</label>
                <input type="number" id="amount" class="form-control" value="100000" min="10000" max="5000000" required oninput="previewEmi()">
            </div>
            <div class="col-md-3">
                <label class="form-label">Tenure (3 – 60 Months)</label>
                <input type="number" id="tenureMonths" class="form-control" value="12" min="3" max="60" required oninput="previewEmi()">
            </div>
            <div class="col-md-3">
                <div class="p-2 bg-light rounded border text-center">
                    <small class="text-muted d-block">Estimated Monthly EMI</small>
                    <strong id="emiPreview" class="text-primary fs-5">₹8,884.88</strong>
                </div>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Apply Now</button>
            </div>
        </form>
    </div>

    <!-- My Loans Table -->
    <div class="card shadow-sm p-4 mb-4">
        <h5 class="mb-3">My Loan Applications</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>Amount</th><th>Tenure</th><th>EMI</th><th>Status</th><th>Admin Remark</th><th>Action</th>
                </tr>
                </thead>
                <tbody id="loansTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Repayment Schedule Section -->
    <div id="repaymentSection" class="card shadow-sm p-4 d-none">
        <h5 class="mb-3">Repayment Schedule — Loan #<span id="selectedLoanId"></span></h5>
        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                <tr><th>#</th><th>Due Date</th><th>EMI Amount</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="repaymentsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token || localStorage.getItem('role') !== 'BORROWER') window.location.href = '/login';

    function showMsg(text, isError = false) {
        const box = document.getElementById('msgBox');
        box.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
        box.innerText = text;
    }

    function previewEmi() {
        const p = Number(document.getElementById('amount').value);
        const n = Number(document.getElementById('tenureMonths').value);
        const r = 12 / (12 * 100);
        if (p > 0 && n >= 3) {
            const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            document.getElementById('emiPreview').innerText = '₹' + emi.toFixed(2);
        }
    }

    async function loadLoans() {
        const res = await fetch('/api/loans', { headers: { 'Authorization': 'Bearer ' + token } });
        const loans = await res.json();
        const tbody = document.getElementById('loansTableBody');
        tbody.innerHTML = loans.length === 0
            ? '<tr><td colspan="7" class="text-center text-muted">No loans yet. Apply above!</td></tr>'
            : loans.map(l => `
            <tr>
                <td>#${l.id}</td>
                <td>₹${l.amount}</td>
                <td>${l.tenureMonths} mos</td>
                <td>₹${l.emi}</td>
                <td><span class="badge bg-${badgeColor(l.status)}">${l.status}</span></td>
                <td>${l.adminRemark || '-'}</td>
                <td>${(l.status === 'APPROVED' || l.status === 'CLOSED')
                ? `<button class="btn btn-sm btn-outline-primary" onclick="loadRepayments(${l.id})">View Schedule</button>`
                : '-'}</td>
            </tr>`).join('');
    }

    function badgeColor(status) {
        return { APPLIED: 'warning text-dark', APPROVED: 'success', REJECTED: 'danger', CLOSED: 'secondary' }[status] || 'primary';
    }

    document.getElementById('applyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/loans', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({
                amount: Number(document.getElementById('amount').value),
                tenureMonths: Number(document.getElementById('tenureMonths').value)
            })
        });
        const data = await res.json();
        if (!res.ok) return showMsg(data.message || 'Application rejected', true);
        showMsg(`Loan #${data.id} submitted! Monthly EMI: ₹${data.emi}`);
        loadLoans();
    });

    async function loadRepayments(loanId) {
        const res = await fetch(`/api/loans/${loanId}/repayments`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const list = await res.json();
        document.getElementById('selectedLoanId').innerText = loanId;
        document.getElementById('repaymentSection').classList.remove('d-none');
        document.getElementById('repaymentsBody').innerHTML = list.map(r => `
        <tr>
            <td>${r.installmentNo}</td>
            <td>${r.dueDate}</td>
            <td>₹${r.amount}</td>
            <td><span class="badge bg-${r.status === 'PAID' ? 'success' : 'warning text-dark'}">${r.status}</span></td>
            <td>${r.status === 'PENDING'
            ? `<button class="btn btn-sm btn-success" onclick="payEmi(${r.id}, ${loanId})">Pay EMI</button>`
            : 'Paid ✓'}</td>
        </tr>`).join('');
    }

    async function payEmi(repaymentId, loanId) {
        const res = await fetch(`/api/repayments/${repaymentId}/pay`, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) return showMsg(data.message, true);
        showMsg(`Installment #${data.installmentNo} paid successfully!`);
        loadRepayments(loanId);
        loadLoans();
    }

    previewEmi();
    loadLoans();
</script>
</body>
</html>
